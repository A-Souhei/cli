<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI CLI{% endblock %}</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Theme detection and management
        (function() {
            const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const getStoredTheme = () => localStorage.getItem('theme');
            const setTheme = (theme) => {
                document.documentElement.classList.remove('light', 'dark');
                document.documentElement.classList.add(theme);
                localStorage.setItem('theme', theme);
            };
            
            // Initialize theme
            const storedTheme = getStoredTheme();
            const theme = storedTheme || getSystemTheme();
            setTheme(theme);
            
            // Listen for system theme changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!getStoredTheme()) {
                    setTheme(e.matches ? 'dark' : 'light');
                }
            });
            
            // Expose theme toggle function
            window.toggleTheme = function() {
                const current = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                setTheme(current === 'dark' ? 'light' : 'dark');
            };
            
            window.setAutoTheme = function() {
                localStorage.removeItem('theme');
                setTheme(getSystemTheme());
            };
        })();
        
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                            950: '#1e1b4b',
                        },
                        surface: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    },
                    boxShadow: {
                        'soft': '0 2px 8px -2px rgba(0, 0, 0, 0.1), 0 4px 16px -4px rgba(0, 0, 0, 0.1)',
                        'glow': '0 0 20px -5px rgba(99, 102, 241, 0.4)',
                    }
                }
            }
        }
    </script>
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style type="text/tailwindcss">
        /* Base styles */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Hide scrollbar utility */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        /* Custom scrollbar - Dark */
        .dark ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .dark ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
        
        /* Custom scrollbar - Light */
        .light ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .light ::-webkit-scrollbar-track {
            background: transparent;
        }
        .light ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 3px;
        }
        .light ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }
        
        /* Button base styles */
        .btn {
            @apply inline-flex items-center justify-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-lg transition-all duration-150 ease-out;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-sm {
            @apply px-2.5 py-1 text-xs;
        }
        .btn-icon {
            @apply p-1.5;
        }
        
        /* Button variants - Dark */
        .dark .btn-primary {
            @apply bg-primary-600 text-white hover:bg-primary-500 shadow-sm;
        }
        .dark .btn-secondary {
            @apply bg-surface-800 text-surface-200 hover:bg-surface-700 border border-surface-700;
        }
        .dark .btn-ghost {
            @apply text-surface-400 hover:text-surface-200 hover:bg-surface-800;
        }
        .dark .btn-danger {
            @apply bg-red-600/10 text-red-400 hover:bg-red-600/20 border border-red-600/20;
        }
        
        /* Button variants - Light */
        .light .btn-primary {
            @apply bg-primary-600 text-white hover:bg-primary-700 shadow-sm;
        }
        .light .btn-secondary {
            @apply bg-white text-surface-700 hover:bg-surface-50 border border-surface-200 shadow-sm;
        }
        .light .btn-ghost {
            @apply text-surface-500 hover:text-surface-900 hover:bg-surface-100;
        }
        .light .btn-danger {
            @apply bg-red-50 text-red-600 hover:bg-red-100 border border-red-200;
        }
        
        /* Card styles */
        .dark .card {
            @apply bg-surface-900 border border-surface-800 rounded-xl;
        }
        .light .card {
            @apply bg-white border border-surface-200 rounded-xl shadow-soft;
        }
        
        /* Input styles */
        .dark .input {
            @apply bg-surface-900 border border-surface-700 text-surface-100 placeholder-surface-500 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500;
        }
        .light .input {
            @apply bg-white border border-surface-300 text-surface-900 placeholder-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:border-primary-500 shadow-sm;
        }
        
        /* Badge styles */
        .badge {
            @apply inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium rounded-full;
        }
        .dark .badge-primary {
            @apply bg-primary-500/15 text-primary-400;
        }
        .dark .badge-success {
            @apply bg-emerald-500/15 text-emerald-400;
        }
        .dark .badge-warning {
            @apply bg-amber-500/15 text-amber-400;
        }
        .dark .badge-neutral {
            @apply bg-surface-700 text-surface-300;
        }
        .light .badge-primary {
            @apply bg-primary-100 text-primary-700;
        }
        .light .badge-success {
            @apply bg-emerald-100 text-emerald-700;
        }
        .light .badge-warning {
            @apply bg-amber-100 text-amber-700;
        }
        .light .badge-neutral {
            @apply bg-surface-100 text-surface-600;
        }
        
        /* Dropdown menu */
        .dark .dropdown-menu {
            @apply bg-surface-900 border border-surface-700 rounded-lg shadow-lg;
        }
        .dark .dropdown-item {
            @apply px-3 py-2 text-sm text-surface-300 hover:bg-surface-800 hover:text-white cursor-pointer;
        }
        .light .dropdown-menu {
            @apply bg-white border border-surface-200 rounded-lg shadow-lg;
        }
        .light .dropdown-item {
            @apply px-3 py-2 text-sm text-surface-600 hover:bg-surface-50 hover:text-surface-900 cursor-pointer;
        }
        
        /* Markdown content styles - Dark */
        .dark .markdown-content h1 { 
            @apply text-2xl font-semibold mb-4 text-white border-b border-surface-700 pb-3;
        }
        .dark .markdown-content h2 { 
            @apply text-xl font-semibold mb-3 mt-8 text-white;
        }
        .dark .markdown-content h3 { 
            @apply text-lg font-medium mb-2 mt-6 text-surface-100;
        }
        .dark .markdown-content h4 {
            @apply text-base font-medium mb-2 text-surface-200;
        }
        .dark .markdown-content p { 
            @apply mb-4 text-surface-300 leading-relaxed;
        }
        .dark .markdown-content ul { 
            @apply list-disc ml-5 mb-4 text-surface-300 space-y-1;
        }
        .dark .markdown-content ol { 
            @apply list-decimal ml-5 mb-4 text-surface-300 space-y-1;
        }
        .dark .markdown-content li { 
            @apply leading-relaxed;
        }
        .dark .markdown-content code { 
            @apply bg-surface-800 px-1.5 py-0.5 rounded text-primary-400 text-sm font-mono;
        }
        .dark .markdown-content pre { 
            @apply bg-surface-950 p-4 rounded-lg mb-4 overflow-x-auto border border-surface-800;
        }
        .dark .markdown-content pre code { 
            @apply bg-transparent p-0 text-surface-200;
        }
        .dark .markdown-content a { 
            @apply text-primary-400 hover:text-primary-300 underline underline-offset-2;
        }
        .dark .markdown-content blockquote { 
            @apply border-l-4 border-primary-500 pl-4 italic text-surface-400 bg-surface-900 py-3 pr-4 rounded-r-lg my-4;
        }
        .dark .markdown-content table {
            @apply w-full border-collapse mb-4;
        }
        .dark .markdown-content th,
        .dark .markdown-content td {
            @apply border border-surface-700 px-3 py-2 text-left;
        }
        .dark .markdown-content th {
            @apply bg-surface-800 text-white font-medium;
        }
        .dark .markdown-content td {
            @apply text-surface-300;
        }
        .dark .markdown-content tr:nth-child(even) {
            @apply bg-surface-900/50;
        }
        .dark .markdown-content hr {
            @apply border-none border-t border-surface-700 my-8;
        }
        .dark .markdown-content strong {
            @apply text-white font-medium;
        }
        
        /* Markdown content styles - Light */
        .light .markdown-content h1 { 
            @apply text-2xl font-semibold mb-4 text-surface-900 border-b border-surface-200 pb-3;
        }
        .light .markdown-content h2 { 
            @apply text-xl font-semibold mb-3 mt-8 text-surface-900;
        }
        .light .markdown-content h3 { 
            @apply text-lg font-medium mb-2 mt-6 text-surface-800;
        }
        .light .markdown-content h4 {
            @apply text-base font-medium mb-2 text-surface-700;
        }
        .light .markdown-content p { 
            @apply mb-4 text-surface-600 leading-relaxed;
        }
        .light .markdown-content ul { 
            @apply list-disc ml-5 mb-4 text-surface-600 space-y-1;
        }
        .light .markdown-content ol { 
            @apply list-decimal ml-5 mb-4 text-surface-600 space-y-1;
        }
        .light .markdown-content li { 
            @apply leading-relaxed;
        }
        .light .markdown-content code { 
            @apply bg-surface-100 px-1.5 py-0.5 rounded text-primary-600 text-sm font-mono;
        }
        .light .markdown-content pre { 
            @apply bg-surface-900 p-4 rounded-lg mb-4 overflow-x-auto border border-surface-800;
        }
        .light .markdown-content pre code { 
            @apply bg-transparent p-0 text-surface-200;
        }
        .light .markdown-content a { 
            @apply text-primary-600 hover:text-primary-700 underline underline-offset-2;
        }
        .light .markdown-content blockquote { 
            @apply border-l-4 border-primary-500 pl-4 italic text-surface-500 bg-surface-50 py-3 pr-4 rounded-r-lg my-4;
        }
        .light .markdown-content table {
            @apply w-full border-collapse mb-4;
        }
        .light .markdown-content th,
        .light .markdown-content td {
            @apply border border-surface-200 px-3 py-2 text-left;
        }
        .light .markdown-content th {
            @apply bg-surface-100 text-surface-900 font-medium;
        }
        .light .markdown-content td {
            @apply text-surface-600;
        }
        .light .markdown-content tr:nth-child(even) {
            @apply bg-surface-50;
        }
        .light .markdown-content hr {
            @apply border-none border-t border-surface-200 my-8;
        }
        .light .markdown-content strong {
            @apply text-surface-900 font-medium;
        }
        .markdown-content img {
            max-width: 100%;
            border-radius: 0.5rem;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full font-sans dark:bg-surface-950 dark:text-surface-100 bg-surface-50 text-surface-900">
    <div class="flex h-full">
        <!-- Sidebar -->
        <aside class="w-56 flex-shrink-0 dark:bg-surface-900 bg-white dark:border-r dark:border-surface-800 border-r border-surface-200 flex flex-col">
            <!-- Logo/Title -->
            <div class="p-4 dark:border-b dark:border-surface-800 border-b border-surface-200">
                <a href="/" class="flex items-center gap-2.5">
                    <div class="w-8 h-8 bg-gradient-to-br from-primary-500 to-primary-700 rounded-lg flex items-center justify-center shadow-sm">
                        <svg class="w-4.5 h-4.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-sm font-semibold dark:text-white text-surface-900">AI CLI</h1>
                        <p class="text-[10px] dark:text-surface-500 text-surface-500">Web Interface</p>
                    </div>
                </a>
            </div>
            
            <!-- Navigation -->
            <nav class="flex-1 p-3 space-y-0.5">
                <a href="/" class="nav-link flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm font-medium transition-colors {% if request.path == '/' or request.path == '/chat' %}dark:bg-primary-600 dark:text-white bg-primary-600 text-white{% else %}dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span>Chat</span>
                </a>
                
                <a href="/dashboard" class="nav-link flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm font-medium transition-colors {% if request.path == '/dashboard' %}dark:bg-primary-600 dark:text-white bg-primary-600 text-white{% else %}dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                
                <a href="/explorer" class="nav-link flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm font-medium transition-colors {% if request.path == '/explorer' %}dark:bg-primary-600 dark:text-white bg-primary-600 text-white{% else %}dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                    <span>Explorer</span>
                </a>
                
                <a href="/sessions" class="nav-link flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm font-medium transition-colors {% if request.path == '/sessions' %}dark:bg-primary-600 dark:text-white bg-primary-600 text-white{% else %}dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                    <span>Sessions</span>
                </a>

                <a href="/models" class="nav-link flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm font-medium transition-colors {% if request.path == '/models' %}dark:bg-primary-600 dark:text-white bg-primary-600 text-white{% else %}dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                    </svg>
                    <span>Models</span>
                </a>

                <a href="/mcps" class="nav-link flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm font-medium transition-colors {% if request.path.startswith('/mcps') %}dark:bg-primary-600 dark:text-white bg-primary-600 text-white{% else %}dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                    <span>MCPs</span>
                </a>
                
                <a href="/docs" class="nav-link flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm font-medium transition-colors {% if request.path == '/docs' %}dark:bg-primary-600 dark:text-white bg-primary-600 text-white{% else %}dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span>Docs</span>
                </a>
                
                <!-- Sessions for Current Directory -->
                <div class="mt-4 pt-3 dark:border-t dark:border-surface-800 border-t border-surface-200">
                    <div class="flex items-center justify-between mb-2 px-1">
                        <h3 class="text-[10px] font-semibold dark:text-surface-500 text-surface-400 uppercase tracking-wider">Recent Sessions</h3>
                        <a href="/sessions" class="text-[10px] text-primary-500 hover:text-primary-400">View all</a>
                    </div>
                    <div id="sidebar-sessions" class="space-y-0.5 max-h-40 overflow-y-auto">
                        <div class="text-xs dark:text-surface-500 text-surface-400 px-2.5 py-1.5">Loading...</div>
                    </div>
                </div>
            </nav>
            
            <!-- Theme Toggle & Working Directory -->
            <div class="p-3 dark:border-t dark:border-surface-800 border-t border-surface-200 space-y-2">
                <!-- Theme Toggle -->
                <div class="flex items-center justify-between px-1">
                    <span class="text-[10px] dark:text-surface-500 text-surface-400 uppercase tracking-wider">Theme</span>
                    <div class="flex items-center gap-1">
                        <button onclick="setAutoTheme()" class="btn btn-ghost btn-icon" title="Auto (System)">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </button>
                        <button onclick="toggleTheme()" class="btn btn-ghost btn-icon" title="Toggle Theme">
                            <!-- Sun icon (shown in dark mode) -->
                            <svg class="w-3.5 h-3.5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                            </svg>
                            <!-- Moon icon (shown in light mode) -->
                            <svg class="w-3.5 h-3.5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Working Directory Info -->
                <div class="px-1">
                    <p class="text-[10px] dark:text-surface-500 text-surface-400 uppercase tracking-wider mb-1">Directory</p>
                    <p class="text-xs dark:text-surface-300 text-surface-600 font-mono break-all leading-relaxed" title="{{ working_dir }}">{{ working_dir }}</p>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 overflow-auto dark:bg-surface-950 bg-surface-50">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <!-- Global Modal Component -->
    <div id="global-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="flex min-h-screen items-center justify-center p-4">
            <!-- Backdrop -->
            <div class="fixed inset-0 bg-black/50 dark:bg-black/70 transition-opacity" onclick="closeGlobalModal()"></div>
            
            <!-- Modal -->
            <div class="relative bg-white dark:bg-surface-800 rounded-xl shadow-2xl max-w-md w-full p-6 transform transition-all">
                <!-- Icon -->
                <div id="modal-icon" class="mx-auto flex h-12 w-12 items-center justify-center rounded-full mb-4">
                    <!-- Icon will be inserted here -->
                </div>
                
                <!-- Title -->
                <h3 id="modal-title" class="text-lg font-semibold dark:text-white text-surface-900 text-center mb-2"></h3>
                
                <!-- Message -->
                <p id="modal-message" class="text-sm dark:text-surface-300 text-surface-600 text-center mb-6"></p>
                
                <!-- Actions -->
                <div id="modal-actions" class="flex gap-3">
                    <!-- Buttons will be inserted here -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Global script to load sidebar sessions -->
    <script>
        // Global modal functions
        function showModal(options) {
            const modal = document.getElementById('global-modal');
            const iconContainer = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');
            const actions = document.getElementById('modal-actions');
            
            // Set icon
            const iconClass = options.type === 'error' ? 'bg-red-100 dark:bg-red-900/20' : 
                             options.type === 'warning' ? 'bg-amber-100 dark:bg-amber-900/20' :
                             options.type === 'success' ? 'bg-emerald-100 dark:bg-emerald-900/20' :
                             'bg-primary-100 dark:bg-primary-900/20';
            const iconColor = options.type === 'error' ? 'text-red-600 dark:text-red-400' :
                             options.type === 'warning' ? 'text-amber-600 dark:text-amber-400' :
                             options.type === 'success' ? 'text-emerald-600 dark:text-emerald-400' :
                             'text-primary-600 dark:text-primary-400';
            const icon = options.type === 'error' ? 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z' :
                        options.type === 'success' ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' :
                        'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
            
            iconContainer.className = `mx-auto flex h-12 w-12 items-center justify-center rounded-full mb-4 ${iconClass}`;
            iconContainer.innerHTML = `<svg class="w-6 h-6 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${icon}"/></svg>`;
            
            // Set content
            title.textContent = options.title || '';
            message.textContent = options.message || '';
            
            // Set actions
            actions.innerHTML = '';
            if (options.confirm) {
                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'btn btn-primary flex-1';
                confirmBtn.textContent = options.confirmText || 'Confirm';
                confirmBtn.onclick = () => {
                    closeGlobalModal();
                    if (options.onConfirm) options.onConfirm();
                };
                actions.appendChild(confirmBtn);
            }
            if (options.cancel) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn btn-secondary flex-1';
                cancelBtn.textContent = options.cancelText || 'Cancel';
                cancelBtn.onclick = () => {
                    closeGlobalModal();
                    if (options.onCancel) options.onCancel();
                };
                actions.appendChild(cancelBtn);
            }
            if (!options.confirm && !options.cancel) {
                const okBtn = document.createElement('button');
                okBtn.className = 'btn btn-primary w-full';
                okBtn.textContent = 'OK';
                okBtn.onclick = closeGlobalModal;
                actions.appendChild(okBtn);
            }
            
            modal.classList.remove('hidden');
        }
        
        function closeGlobalModal() {
            document.getElementById('global-modal').classList.add('hidden');
        }
        
        // Helper functions
        function showAlert(message, type = 'info') {
            showModal({
                type: type,
                title: type === 'error' ? 'Error' : type === 'warning' ? 'Warning' : type === 'success' ? 'Success' : 'Information',
                message: message
            });
        }
        
        function showConfirm(message, onConfirm, onCancel) {
            showModal({
                type: 'warning',
                title: 'Confirm Action',
                message: message,
                confirm: true,
                cancel: true,
                onConfirm: onConfirm,
                onCancel: onCancel
            });
        }
        
        // Load sessions for sidebar (only for current working directory)
        async function loadSidebarSessions() {
            const container = document.getElementById('sidebar-sessions');
            if (!container) return;
            
            try {
                // Only fetch sessions for current working directory (no ?all=true)
                const response = await fetch('/api/sessions/');
                const data = await response.json();
                
                if (data.status === 'success' && data.sessions && data.sessions.length > 0) {
                    // Show only first 5 sessions
                    const sessions = data.sessions.slice(0, 5);
                    container.innerHTML = sessions.map(session => {
                        const title = session.title || 'Untitled';
                        const shortId = session.session_id ? session.session_id.substring(0, 8) : '';
                        const sessionId = session.session_id;
                        return `
                            <a href="/chat?restore=${sessionId}" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-white text-surface-600 hover:bg-surface-100 hover:text-surface-900 transition-colors">
                                <svg class="w-3.5 h-3.5 flex-shrink-0 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                </svg>
                                <span class="truncate" title="${title}">${title}</span>
                            </a>
                        `;
                    }).join('');
                    
                    if (data.sessions.length > 5) {
                        container.innerHTML += `
                            <a href="/sessions" class="block text-[10px] text-primary-500 hover:text-primary-400 px-2.5 py-1">
                                +${data.sessions.length - 5} more...
                            </a>
                        `;
                    }
                } else {
                    container.innerHTML = '<div class="text-xs dark:text-surface-600 text-surface-400 px-2.5 py-1.5">No sessions</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="text-xs text-red-400 px-2.5 py-1.5">Failed to load</div>';
            }
        }
        
        // Load sidebar sessions on page load
        document.addEventListener('DOMContentLoaded', loadSidebarSessions);
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
