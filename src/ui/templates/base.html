<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI CLI{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Markdown content styles */
        .markdown-content h1 { @apply text-2xl font-bold mb-4 text-white; }
        .markdown-content h2 { @apply text-xl font-semibold mb-3 text-white; }
        .markdown-content h3 { @apply text-lg font-medium mb-2 text-white; }
        .markdown-content p { @apply mb-4 text-gray-300; }
        .markdown-content ul { @apply list-disc list-inside mb-4 text-gray-300; }
        .markdown-content ol { @apply list-decimal list-inside mb-4 text-gray-300; }
        .markdown-content li { @apply mb-1; }
        .markdown-content code { @apply bg-dark-800 px-1.5 py-0.5 rounded text-primary-400 text-sm; }
        .markdown-content pre { @apply bg-dark-900 p-4 rounded-lg mb-4 overflow-x-auto; }
        .markdown-content pre code { @apply bg-transparent p-0; }
        .markdown-content a { @apply text-primary-400 hover:text-primary-300 underline; }
        .markdown-content blockquote { @apply border-l-4 border-primary-500 pl-4 italic text-gray-400 mb-4; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-dark-950 text-gray-100">
    <div class="flex h-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-dark-900 border-r border-dark-700 flex flex-col">
            <!-- Logo/Title -->
            <div class="p-4 border-b border-dark-700">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-white">AI CLI</h1>
                        <p class="text-xs text-gray-400">Web Interface</p>
                    </div>
                </a>
            </div>
            
            <!-- Navigation -->
            <nav class="flex-1 p-4 space-y-2">
                <a href="/" class="nav-link flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors {% if request.path == '/' or request.path == '/chat' %}bg-primary-600 text-white{% else %}text-gray-300 hover:bg-dark-800 hover:text-white{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span>Chat</span>
                </a>
                
                <a href="/dashboard" class="nav-link flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors {% if request.path == '/dashboard' %}bg-primary-600 text-white{% else %}text-gray-300 hover:bg-dark-800 hover:text-white{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                
                <a href="/sessions" class="nav-link flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors {% if request.path == '/sessions' %}bg-primary-600 text-white{% else %}text-gray-300 hover:bg-dark-800 hover:text-white{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                    <span>Sessions</span>
                </a>
                
                <a href="/mcps" class="nav-link flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors {% if request.path == '/mcps' %}bg-primary-600 text-white{% else %}text-gray-300 hover:bg-dark-800 hover:text-white{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                    <span>MCPs & Tools</span>
                </a>
                
                <a href="/docs" class="nav-link flex items-center space-x-3 px-3 py-2 rounded-lg transition-colors {% if request.path == '/docs' %}bg-primary-600 text-white{% else %}text-gray-300 hover:bg-dark-800 hover:text-white{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span>Documentation</span>
                </a>
                
                <!-- Sessions for Current Directory -->
                <div class="mt-6 pt-4 border-t border-dark-700">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Sessions</h3>
                        <a href="/sessions" class="text-xs text-primary-400 hover:text-primary-300">View all</a>
                    </div>
                    <div id="sidebar-sessions" class="space-y-1 max-h-48 overflow-y-auto">
                        <div class="text-xs text-gray-500 py-2">Loading...</div>
                    </div>
                </div>
            </nav>
            
            <!-- Working Directory Info -->
            <div class="p-4 border-t border-dark-700">
                <p class="text-xs text-gray-500 mb-1">Working Directory</p>
                <p class="text-sm text-gray-300 truncate" title="{{ working_dir }}">{{ working_dir }}</p>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 overflow-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <!-- Global script to load sidebar sessions -->
    <script>
        // Load sessions for sidebar (only for current working directory)
        async function loadSidebarSessions() {
            const container = document.getElementById('sidebar-sessions');
            if (!container) return;
            
            try {
                // Only fetch sessions for current working directory (no ?all=true)
                const response = await fetch('/api/sessions/');
                const data = await response.json();
                
                if (data.status === 'success' && data.sessions && data.sessions.length > 0) {
                    // Show only first 5 sessions
                    const sessions = data.sessions.slice(0, 5);
                    container.innerHTML = sessions.map(session => {
                        const title = session.title || 'Untitled';
                        const shortId = session.session_id ? session.session_id.substring(0, 8) : '';
                        return `
                            <a href="/sessions" class="flex items-center space-x-2 px-2 py-1.5 rounded text-sm text-gray-400 hover:bg-dark-800 hover:text-white transition-colors">
                                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                </svg>
                                <span class="truncate" title="${title}">${title}</span>
                            </a>
                        `;
                    }).join('');
                    
                    if (data.sessions.length > 5) {
                        container.innerHTML += `
                            <a href="/sessions" class="block text-xs text-primary-400 hover:text-primary-300 px-2 py-1">
                                +${data.sessions.length - 5} more...
                            </a>
                        `;
                    }
                } else {
                    container.innerHTML = '<div class="text-xs text-gray-500 py-2">No sessions for this directory</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="text-xs text-red-400 py-2">Failed to load</div>';
            }
        }
        
        // Load sidebar sessions on page load
        document.addEventListener('DOMContentLoaded', loadSidebarSessions);
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
