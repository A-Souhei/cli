{% extends "base.html" %}

{% block title %}Sessions - AI CLI{% endblock %}

{% block content %}
<div class="p-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-3xl font-bold text-white mb-2">Sessions</h1>
            <p class="text-gray-400">Manage your conversation sessions</p>
        </div>
        <div class="flex items-center space-x-4">
            <label class="flex items-center space-x-2 text-gray-300">
                <input type="checkbox" id="show-all" class="rounded bg-dark-700 border-dark-600 text-primary-500 focus:ring-primary-500">
                <span class="text-sm">Show all directories</span>
            </label>
            <button onclick="clearSessions()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                <span>Clear All</span>
            </button>
        </div>
    </div>
    
    <!-- Working Directory Info -->
    <div class="bg-dark-800 rounded-lg p-4 border border-dark-700 mb-6">
        <div class="flex items-center space-x-3">
            <svg class="w-5 h-5 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
            </svg>
            <span class="text-gray-300">Current Directory:</span>
            <code class="text-primary-400 bg-dark-900 px-2 py-1 rounded">{{ working_dir }}</code>
        </div>
    </div>
    
    <!-- Sessions List -->
    <div id="sessions-container" class="space-y-4">
        <div class="text-gray-400 text-center py-12">
            <svg class="w-12 h-12 mx-auto mb-4 text-gray-600 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p>Loading sessions...</p>
        </div>
    </div>
</div>

<!-- Session Details Modal -->
<div id="session-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-dark-800 rounded-xl p-6 max-w-4xl w-full mx-4 max-h-[80vh] overflow-auto border border-dark-700">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-white" id="modal-title">Session Details</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div id="modal-content" class="space-y-4">
            <!-- Content will be loaded here -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let showAll = false;
    
    // Toggle show all
    document.getElementById('show-all').addEventListener('change', function(e) {
        showAll = e.target.checked;
        loadSessions();
    });
    
    // Load sessions
    async function loadSessions() {
        const container = document.getElementById('sessions-container');
        
        try {
            const url = showAll ? '/api/sessions/?all=true' : '/api/sessions/';
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.status === 'success' && data.sessions.length > 0) {
                container.innerHTML = data.sessions.map(session => `
                    <div class="bg-dark-800 rounded-xl p-6 border border-dark-700 hover:border-primary-500/50 transition-colors">
                        <div class="flex items-start justify-between">
                            <div class="flex items-start space-x-4">
                                <div class="w-12 h-12 bg-primary-500/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                    <svg class="w-6 h-6 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="text-lg font-semibold text-white mb-1">${session.title || 'Untitled Session'}</h3>
                                    <p class="text-gray-400 text-sm mb-2">
                                        <span class="font-mono">${session.session_id ? session.session_id.substring(0, 16) + '...' : 'N/A'}</span>
                                    </p>
                                    <div class="flex items-center space-x-4 text-sm text-gray-500">
                                        <span class="flex items-center space-x-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                                            </svg>
                                            <span>${session.num_interactions || 0} interactions</span>
                                        </span>
                                        ${session.start_time ? `
                                        <span class="flex items-center space-x-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                            </svg>
                                            <span>${new Date(session.start_time).toLocaleString()}</span>
                                        </span>
                                        ` : ''}
                                    </div>
                                    ${session.working_dir ? `
                                    <p class="text-gray-500 text-xs mt-2 font-mono truncate max-w-md" title="${session.working_dir}">${session.working_dir}</p>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="viewSession('${session.session_id}')" class="p-2 text-gray-400 hover:text-primary-400 hover:bg-dark-700 rounded-lg transition-colors" title="View Details">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                                <button onclick="deleteSession('${session.session_id}')" class="p-2 text-gray-400 hover:text-red-400 hover:bg-dark-700 rounded-lg transition-colors" title="Delete">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                        </svg>
                        <h3 class="text-lg font-medium text-gray-400 mb-2">No sessions found</h3>
                        <p class="text-gray-500">Start a session in the CLI with <code class="bg-dark-700 px-2 py-1 rounded">/session start</code></p>
                    </div>
                `;
            }
        } catch (error) {
            container.innerHTML = `
                <div class="text-center py-12 text-red-400">
                    <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p>Failed to load sessions: ${error.message}</p>
                </div>
            `;
        }
    }
    
    // View session details
    async function viewSession(sessionId) {
        const modal = document.getElementById('session-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        
        modalContent.innerHTML = '<div class="text-gray-400 text-center py-8">Loading...</div>';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        try {
            const response = await fetch(`/api/sessions/${sessionId}`);
            const data = await response.json();
            
            if (data.status === 'success' && data.session) {
                const session = data.session;
                modalTitle.textContent = session.title || 'Session Details';
                
                let historyHtml = '';
                if (session.history && session.history.length > 0) {
                    historyHtml = session.history.map((interaction, idx) => `
                        <div class="bg-dark-700 rounded-lg p-4">
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="px-2 py-1 bg-primary-500/20 text-primary-400 text-xs rounded">#${idx + 1}</span>
                                <span class="text-gray-500 text-xs">${new Date(interaction.timestamp).toLocaleString()}</span>
                            </div>
                            <div class="mb-3">
                                <p class="text-gray-400 text-sm mb-1">User:</p>
                                <p class="text-white">${escapeHtml(interaction.prompt)}</p>
                            </div>
                            <div>
                                <p class="text-gray-400 text-sm mb-1">Assistant:</p>
                                <div class="text-gray-300 text-sm max-h-40 overflow-y-auto">${escapeHtml(interaction.response.substring(0, 500))}${interaction.response.length > 500 ? '...' : ''}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    historyHtml = '<p class="text-gray-500">No interactions recorded</p>';
                }
                
                modalContent.innerHTML = `
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-dark-700 rounded-lg p-4">
                            <p class="text-gray-400 text-sm mb-1">Session ID</p>
                            <p class="text-white font-mono text-sm">${session.session_id}</p>
                        </div>
                        <div class="bg-dark-700 rounded-lg p-4">
                            <p class="text-gray-400 text-sm mb-1">Start Time</p>
                            <p class="text-white">${session.start_time ? new Date(session.start_time).toLocaleString() : 'N/A'}</p>
                        </div>
                        <div class="bg-dark-700 rounded-lg p-4">
                            <p class="text-gray-400 text-sm mb-1">Interactions</p>
                            <p class="text-white">${session.history ? session.history.length : 0}</p>
                        </div>
                        <div class="bg-dark-700 rounded-lg p-4">
                            <p class="text-gray-400 text-sm mb-1">Working Directory</p>
                            <p class="text-white text-sm font-mono truncate" title="${session.working_dir || 'N/A'}">${session.working_dir || 'N/A'}</p>
                        </div>
                    </div>
                    <h3 class="text-lg font-semibold text-white mb-4">Conversation History</h3>
                    <div class="space-y-4 max-h-96 overflow-y-auto">${historyHtml}</div>
                `;
            } else {
                modalContent.innerHTML = '<div class="text-red-400 text-center py-8">Failed to load session details</div>';
            }
        } catch (error) {
            modalContent.innerHTML = `<div class="text-red-400 text-center py-8">Error: ${error.message}</div>`;
        }
    }
    
    // Delete session
    async function deleteSession(sessionId) {
        if (!confirm('Are you sure you want to delete this session?')) return;
        
        try {
            const response = await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
            const data = await response.json();
            
            if (data.status === 'success') {
                loadSessions();
            } else {
                alert('Failed to delete session: ' + data.message);
            }
        } catch (error) {
            alert('Error deleting session: ' + error.message);
        }
    }
    
    // Clear all sessions
    async function clearSessions() {
        if (!confirm('Are you sure you want to delete all sessions for this directory?')) return;
        
        try {
            const response = await fetch('/api/sessions/clear', { method: 'DELETE' });
            const data = await response.json();
            
            if (data.status === 'success') {
                loadSessions();
            } else {
                alert('Failed to clear sessions: ' + data.message);
            }
        } catch (error) {
            alert('Error clearing sessions: ' + error.message);
        }
    }
    
    // Close modal
    function closeModal() {
        const modal = document.getElementById('session-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }
    
    // Escape HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Close modal on click outside
    document.getElementById('session-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
    
    // Load sessions on page load
    document.addEventListener('DOMContentLoaded', loadSessions);
</script>
{% endblock %}
