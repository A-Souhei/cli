{% extends "base.html" %}

{% block title %}MCPs - AI CLI{% endblock %}

{% block content %}
<div class="p-8">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">MCPs</h1>
        <p class="text-gray-400">Available Model Context Protocol servers</p>
    </div>
    
    <!-- MCPs Grid -->
    <div id="mcps-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="text-gray-400 text-center py-12 col-span-full">
            <svg class="w-12 h-12 mx-auto mb-4 text-gray-600 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p>Loading MCPs...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Load MCPs
    async function loadMCPs() {
        const container = document.getElementById('mcps-container');
        
        try {
            // Get all MCPs
            const mcpsResponse = await fetch('/api/mcps/');
            const mcpsData = await mcpsResponse.json();
            
            if (mcpsData.status !== 'success') {
                throw new Error(mcpsData.message || 'Failed to load MCPs');
            }
            
            // Get tools count per MCP
            const toolsResponse = await fetch('/api/mcps/tools');
            const toolsData = await toolsResponse.json();
            const toolsByMcp = toolsData.tools_by_mcp || {};
            
            if (mcpsData.mcps.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 col-span-full">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                        </svg>
                        <h3 class="text-lg font-medium text-gray-400 mb-2">No MCPs found</h3>
                        <p class="text-gray-500">MCP servers should be in the system_mcps directory</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = mcpsData.mcps.map(mcp => {
                const tools = toolsByMcp[mcp.name] || [];
                const safeMcpName = escapeHtml(mcp.name);
                const safeMcpDesc = escapeHtml(mcp.description || 'Model Context Protocol Server');
                
                return `
                    <a href="/mcps/${encodeURIComponent(mcp.name)}" 
                       class="block bg-dark-800 rounded-xl border border-dark-700 hover:border-primary-500 transition-all hover:shadow-lg hover:shadow-primary-500/10 group">
                        <div class="p-6">
                            <div class="flex items-start space-x-4">
                                <div class="w-14 h-14 bg-gradient-to-br from-green-500 to-green-700 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:scale-105 transition-transform">
                                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                                    </svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="text-xl font-bold text-white mb-1 group-hover:text-primary-400 transition-colors">${safeMcpName}</h3>
                                    <p class="text-gray-400 text-sm line-clamp-2">${safeMcpDesc}</p>
                                </div>
                            </div>
                            
                            <div class="mt-4 pt-4 border-t border-dark-700 flex items-center justify-between">
                                <div class="flex items-center space-x-4 text-sm">
                                    <span class="flex items-center space-x-1 text-gray-500">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        </svg>
                                        <span>${tools.length} tool${tools.length !== 1 ? 's' : ''}</span>
                                    </span>
                                    ${mcp.has_readme ? `
                                    <span class="flex items-center space-x-1 text-green-500">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                        <span>Docs</span>
                                    </span>
                                    ` : ''}
                                </div>
                                <svg class="w-5 h-5 text-gray-500 group-hover:text-primary-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
            
        } catch (error) {
            container.innerHTML = `
                <div class="text-center py-12 col-span-full text-red-400">
                    <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p>Failed to load MCPs: ${error.message}</p>
                </div>
            `;
        }
    }
    
    // Escape HTML
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }
    
    // Load MCPs on page load
    document.addEventListener('DOMContentLoaded', loadMCPs);
</script>
{% endblock %}
