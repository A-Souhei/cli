{% extends "base.html" %}

{% block title %}File Explorer - AI CLI{% endblock %}

{% block content %}
<div class="h-full flex flex-col">
    <!-- Header -->
    <div class="flex-shrink-0 bg-white dark:bg-surface-900 border-b border-surface-200 dark:border-surface-800 p-4">
        <div class="flex items-center justify-between mb-3">
            <div>
                <h1 class="text-base font-semibold text-surface-900 dark:text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                    <span>File Explorer</span>
                </h1>
                <p class="text-surface-500 dark:text-surface-400 text-xs mt-0.5">Browse your working directory</p>
            </div>
            <div class="flex items-center gap-4">
                <!-- Auto-refresh toggle -->
                <label class="flex items-center gap-1.5 text-xs text-surface-500 dark:text-surface-400 cursor-pointer">
                    <input type="checkbox" id="auto-refresh" class="rounded bg-white dark:bg-surface-800 border-surface-300 dark:border-surface-600 text-primary-500 focus:ring-primary-500 focus:ring-offset-0">
                    <span>Auto-refresh</span>
                </label>
                
                <!-- Show hidden files toggle -->
                <label class="flex items-center gap-1.5 text-xs text-surface-500 dark:text-surface-400 cursor-pointer">
                    <input type="checkbox" id="show-hidden" class="rounded bg-white dark:bg-surface-800 border-surface-300 dark:border-surface-600 text-primary-500 focus:ring-primary-500 focus:ring-offset-0">
                    <span>Show hidden</span>
                </label>
                
                <!-- Refresh button -->
                <button id="refresh-btn" class="btn btn-secondary btn-sm gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
        </div>
        
        <!-- Breadcrumb -->
        <div id="breadcrumb" class="flex items-center gap-1 text-xs">
            <span class="text-surface-400 dark:text-surface-500">Loading...</span>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        <!-- File List -->
        <div class="flex-1 overflow-auto p-4">
            <!-- Stats bar -->
            <div id="stats-bar" class="mb-3 flex items-center justify-between text-xs dark:text-surface-500 text-surface-400">
                <span id="item-count">Loading...</span>
                <span id="last-refresh"></span>
            </div>
            
            <!-- File grid/list -->
            <div id="file-list" class="space-y-0.5">
                <div class="dark:text-surface-500 text-surface-400 text-center py-6 text-sm">Loading...</div>
            </div>
        </div>
        
        <!-- File Preview Panel -->
        <div id="preview-panel" class="hidden w-1/2 max-w-3xl border-l dark:border-surface-700 border-surface-200 dark:bg-surface-900 bg-white flex flex-col">
            <div class="p-3 border-b dark:border-surface-700 border-surface-200 flex items-center justify-between">
                <h3 class="font-medium dark:text-white text-surface-900 text-sm truncate" id="preview-title">Preview</h3>
                <button id="close-preview" class="btn btn-ghost btn-icon">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="preview-content" class="flex-1 overflow-auto p-4">
                <!-- Preview content goes here -->
            </div>
            <div id="preview-footer" class="p-3 border-t dark:border-surface-700 border-surface-200 text-xs dark:text-surface-400 text-surface-500">
                <!-- File info goes here -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

    function getIcon(iconType) {
        return icons[iconType] || icons.file;
    }
    
    async function loadDirectory(path = '') {
        try {
            const params = new URLSearchParams({
                path: path,
                show_hidden: showHidden.toString()
            });
            
            const response = await fetch(`/api/files/list?${params}`);
            const data = await response.json();
            
            if (data.status === 'success') {
                currentPath = path;
                renderBreadcrumb(data.breadcrumb);
                renderFileList(data.items);
                updateStats(data);
            } else {
                showError(data.message);
            }
        } catch (error) {
            showError('Failed to load directory: ' + error.message);
        }
    }
    
    function renderBreadcrumb(items) {
        breadcrumb.innerHTML = items.map((item, idx) => {
            const isLast = idx === items.length - 1;
            if (isLast) {
                return `<span class="dark:text-white text-surface-900 font-medium">${item.name}</span>`;
            }
            return `
                <button class="text-primary-500 hover:text-primary-400 transition-colors" onclick="loadDirectory('${item.path}')">
                    ${item.name}
                </button>
                <svg class="w-3.5 h-3.5 dark:text-surface-600 text-surface-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            `;
        }).join('');
    }
    
    function renderFileList(items) {
        if (items.length === 0) {
            fileList.innerHTML = `
                <div class="text-center py-10 dark:text-surface-500 text-surface-400">
                    <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                    <p class="text-sm">This folder is empty</p>
                </div>
            `;
            return;
        }
        
        fileList.innerHTML = items.map(item => `
            <div 
                class="file-item flex items-center p-2.5 rounded-lg hover:dark:bg-surface-800 hover:bg-surface-100 cursor-pointer transition-colors group ${selectedFile === item.path ? 'dark:bg-surface-800 bg-surface-100 ring-1 ring-primary-500' : ''}"
                data-path="${item.path}"
                data-is-dir="${item.is_dir}"
                onclick="handleItemClick(event, '${item.path}', ${item.is_dir})"
                ondblclick="handleItemDblClick('${item.path}', ${item.is_dir})"
            >
                <div class="flex-shrink-0 mr-2.5">
                    ${getIcon(item.icon)}
                </div>
                <div class="flex-1 min-w-0">
                    <p class="dark:text-white text-surface-900 text-sm truncate ${item.is_dir ? 'font-medium' : ''}">${item.name}</p>
                </div>
                <div class="flex-shrink-0 text-right text-xs dark:text-surface-500 text-surface-400 gap-3 opacity-0 group-hover:opacity-100 transition-opacity flex">
                    ${item.size_formatted ? `<span>${item.size_formatted}</span>` : ''}
                    <span>${item.modified_formatted}</span>
                </div>
            </div>
        `).join('');
    }
    
    function updateStats(data) {
        const dirs = data.items.filter(i => i.is_dir).length;
        const files = data.items.filter(i => !i.is_dir).length;
        itemCount.textContent = `${dirs} folder${dirs !== 1 ? 's' : ''}, ${files} file${files !== 1 ? 's' : ''}`;
        lastRefresh.textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;
    }
    
    function handleItemClick(event, path, isDir) {
        event.stopPropagation();
        selectedFile = path;
        
        // Update selection UI
        document.querySelectorAll('.file-item').forEach(el => {
            el.classList.remove('dark:bg-surface-800', 'bg-surface-100', 'ring-1', 'ring-primary-500');
        });
        event.currentTarget.classList.add('dark:bg-surface-800', 'bg-surface-100', 'ring-1', 'ring-primary-500');
        
        // Show preview for files
        if (!isDir) {
            showPreview(path);
        } else {
            hidePreview();
        }
    }
    
    function handleItemDblClick(path, isDir) {
        if (isDir) {
            loadDirectory(path);
            hidePreview();
        }
    }
    
    async function showPreview(path) {
        previewPanel.classList.remove('hidden');
        previewTitle.textContent = path.split('/').pop();
        previewContent.innerHTML = '<div class="dark:text-surface-500 text-surface-400 text-center py-6 text-sm">Loading...</div>';
        
        try {
            const response = await fetch(`/api/files/read?path=${encodeURIComponent(path)}`);
            const data = await response.json();
            
            if (data.status === 'success') {
                if (data.is_binary) {
                    previewContent.innerHTML = `
                        <div class="text-center py-8 dark:text-surface-500 text-surface-400">
                            <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <p class="text-sm">Binary file - cannot preview</p>
                        </div>
                    `;
                } else {
                    // Render content with line numbers
                    const lines = data.content.split('\n');
                    const lineNumberWidth = String(lines.length).length;
                    
                    previewContent.innerHTML = `
                        <pre class="text-xs font-mono dark:bg-surface-950 bg-surface-50 rounded-lg p-3 overflow-x-auto"><code>${
                            lines.map((line, idx) => {
                                const lineNum = String(idx + 1).padStart(lineNumberWidth, ' ');
                                const escapedLine = line
                                    .replace(/&/g, '&amp;')
                                    .replace(/</g, '&lt;')
                                    .replace(/>/g, '&gt;');
                                return `<span class="dark:text-surface-600 text-surface-400 select-none">${lineNum}</span>  <span class="dark:text-surface-300 text-surface-700">${escapedLine}</span>`;
                            }).join('\n')
                        }</code></pre>
                    `;
                }
                
                previewFooter.innerHTML = `
                    <div class="flex justify-between">
                        <span>${data.size_formatted} • ${data.line_count} lines</span>
                        <span>${data.modified_formatted}</span>
                    </div>
                `;
            } else {
                previewContent.innerHTML = `
                    <div class="text-center py-6 text-red-500 text-sm">
                        <p>${data.message}</p>
                    </div>
                `;
            }
        } catch (error) {
            previewContent.innerHTML = `
                <div class="text-center py-6 text-red-500 text-sm">
                    <p>Failed to load preview: ${error.message}</p>
                </div>
            `;
        }
    }
    
    function hidePreview() {
        previewPanel.classList.add('hidden');
        selectedFile = null;
    }
    
    function showError(message) {
        fileList.innerHTML = `
            <div class="text-center py-10 text-red-500">
                <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <p class="text-sm">${message}</p>
            </div>
        `;
    }
    
    // Event Listeners
    refreshBtn.addEventListener('click', () => loadDirectory(currentPath));
    
    showHiddenCheckbox.addEventListener('change', (e) => {
        showHidden = e.target.checked;
        loadDirectory(currentPath);
    });
    
    autoRefreshCheckbox.addEventListener('change', (e) => {
        autoRefresh = e.target.checked;
        if (autoRefresh) {
            refreshInterval = setInterval(() => loadDirectory(currentPath), 3000);
        } else if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
    });
    
    closePreview.addEventListener('click', hidePreview);
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            hidePreview();
        }
        if (e.key === 'Backspace' && !e.target.matches('input, textarea')) {
            e.preventDefault();
            // Go up one directory
            const parts = currentPath.split('/').filter(Boolean);
            if (parts.length > 0) {
                parts.pop();
                loadDirectory(parts.join('/'));
            }
        }
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
            e.preventDefault();
            loadDirectory(currentPath);
        }
    });
    
    // Initial load
    loadDirectory();
</script>
{% endblock %}
