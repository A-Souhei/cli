[supervisord]
nodaemon=true
user=root

[program:init-db]
command=/docker-entrypoint-initdb.d/init-db.sh
autostart=true
autorestart=false
startsecs=0
stderr_logfile=/var/log/init-db.err.log
stdout_logfile=/var/log/init-db.out.log
priority=5

[program:postgresql]
user=postgres
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/postgresql.err.log
stdout_logfile=/var/log/postgresql.out.log
priority=10

[program:flask]
directory=/app
command=python3 app.py
autostart=true
autorestart=true
stderr_logfile=/var/log/flask.err.log
stdout_logfile=/var/log/flask.out.log
priority=20
environment=FLASK_APP="app.py",FLASK_ENV="development"
