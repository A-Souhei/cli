# Ollama AI CLI Configuration

# NOTE: Models are now managed dynamically via ModelRegistry (stored in Redis)
# The ollama.model and ollama.coder_model fields below will be auto-migrated
# to the ModelRegistry on first startup. After migration, you can remove them.
#
# To manage models, use:
#   /model general add <url> <model_name>  - Add a general chat model
#   /model coder add <url> <model_name>    - Add a coder model
#   /model list                            - List registered models
#   /model status                          - Check availability
#
# Or use the Web UI at /models

# Local tinyollama configuration (lightweight fallback)
# This is the only model that stays in config - used when primary models unavailable
tinyollama:
  url: "http://localhost:11434"
  model: "tinyllama"
  timeout: 60
  # Features disabled for tinyollama (lightweight model limitations)
  disabled_features:
    - code_mode        # /code command - requires larger models
    - coder_model      # Code editing - requires specialized coder models
    - repomap_create   # Repository mapping - requires large context
    - repomap_update   # Repository map update - requires large context
    - datamap_create   # Data mapping - requires large context
    - datamap_update   # Data map update - requires large context

# Chat configuration
chat:
  system_prompt: "You are a helpful AI assistant."
  max_context_length: 10
  temperature: 0.7
  stream: true

# Tabular GMD (Gaussian Multinomial Diffusion) configuration
# Service for generating synthetic tabular data using diffusion models
tabular_gmd:
  url: "http://192.168.31.23:15432"
  timeout: 300  # 5 minutes - synthetic data generation can take time

# File modification action keywords
# When these keywords are detected with @file references, the system will
# automatically instruct the LLM to use MCP tools for file modifications
file_action_keywords:
  - refactor      # Restructure/reorganize code
  - create        # Create new files/functions
  - update        # Update existing code
  - modify        # Modify code
  - edit          # Edit files
  - change        # Change code
  - rewrite       # Rewrite sections
  - add           # Add code/imports
  - import        # Import modules/functions
  - include       # Include code/modules
  - remove        # Remove code/imports
  - delete        # Delete code sections
  - replace       # Replace code
  - rename        # Rename functions/classes/variables
  - move          # Move code between files
  - insert        # Insert code
  - append        # Append to end
  - prepend       # Prepend to start
  - fix           # Fix bugs
  - implement     # Implement features
  - extend        # Extend classes/functions
