# AI CLI Configuration

# Provider selection: "ollama" or "anthropic"
provider: "ollama"

# Ollama service configuration
ollama:
  # Ollama service URL (local or remote)
  url: "http://192.168.31.23:11434"
  
  # Model to use (e.g., tinyllama, llama2, mistral, codellama, etc.)
  model: "llama3.1:8b"
  
  # Optional: Request timeout in seconds
  timeout: 120

# Anthropic service configuration
anthropic:
  # Model to use (e.g., claude-3-5-sonnet-20241022, claude-3-opus-20240229, etc.)
  model: "claude-3-5-sonnet-20241022"

  # Optional: Request timeout in seconds
  timeout: 120

  # Note: API key is stored in secrets.yml

# Chat configuration
chat:
  # System prompt (optional)
  system_prompt: "You are a helpful AI assistant."
  
  # Maximum context length
  max_context_length: 10
  
  # Temperature for response generation (0.0 - 1.0)
  temperature: 0.7
  
  # Stream responses (true/false)
  stream: true
