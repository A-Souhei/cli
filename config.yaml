# Ollama AI CLI Configuration

# Ollama service configuration
ollama:
  # Ollama service URL (local or remote)
  url: "http://192.168.31.23:11434"
  
  # Model to use (e.g., tinyllama, llama2, mistral, codellama, etc.)
  model: "llama3.1:8b"
  
  # Model to use for code editing tasks (should be a coder-optimized model)
  coder_model: "qwen2.5-coder:7b"
  
  # Optional: Request timeout in seconds
  timeout: 120

# Local tinyollama configuration (Docker container fallback)
# This is used when remote ollama is not reachable or as a lightweight alternative
tinyollama:
  # Tinyollama service URL (local Docker container)
  url: "http://localhost:11434"
  
  # Model to use (tinyllama is lightweight, ~1GB, CPU-friendly)
  model: "tinyllama"
  
  # Optional: Request timeout in seconds
  timeout: 60
  
  # Heavy features disabled for tinyollama (lightweight model limitations)
  # Code mode uses advanced code generation which requires larger models
  disable_code_mode: true
  
  # Features that are disabled when using tinyollama
  disabled_features:
    - code_mode        # /code command - requires larger models for code generation
    - coder_model      # Code editing - requires specialized coder models
    - repomap_create   # Repository mapping - requires large context understanding
    - repomap_update   # Repository map update - requires large context understanding
    - datamap_create   # Data mapping - requires large context understanding
    - datamap_update   # Data map update - requires large context understanding

# Chat configuration
chat:
  # System prompt (optional)
  system_prompt: "You are a helpful AI assistant."
  
  # Maximum context length
  max_context_length: 10
  
  # Temperature for response generation (0.0 - 1.0)
  temperature: 0.7
  
  # Stream responses (true/false)
  stream: true
