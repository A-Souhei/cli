# Ollama AI CLI Configuration

# NOTE: Models are now managed dynamically via ModelRegistry (stored in Redis)
# The ollama.model and ollama.coder_model fields below will be auto-migrated
# to the ModelRegistry on first startup. After migration, you can remove them.
#
# To manage models, use:
#   /model general add <url> <model_name>  - Add a general chat model
#   /model coder add <url> <model_name>    - Add a coder model
#   /model list                            - List registered models
#   /model status                          - Check availability
#
# Or use the Web UI at /models

# Local tinyollama configuration (lightweight fallback)
# This is the only model that stays in config - used when primary models unavailable
tinyollama:
  url: "http://localhost:11434"
  model: "tinyllama"
  timeout: 60
  # Features disabled for tinyollama (lightweight model limitations)
  disabled_features:
    - code_mode        # /code command - requires larger models
    - coder_model      # Code editing - requires specialized coder models
    - repomap_create   # Repository mapping - requires large context
    - repomap_update   # Repository map update - requires large context
    - datamap_create   # Data mapping - requires large context
    - datamap_update   # Data map update - requires large context

# Chat configuration
chat:
  system_prompt: "You are a helpful AI assistant."
  max_context_length: 10
  temperature: 0.7
  stream: true
