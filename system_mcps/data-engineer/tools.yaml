# Data Engineer MCP Tool Definitions
# This file defines tool metadata including categories for dynamic tool routing

categories:
  data_generation:
    description: "Tools for generating synthetic or fake data"
    tools:
      - generate_fake_data
      - generate_fake_data_ctgan
      - generate_fake_data_with_ddpm

  code_analysis:
    description: "Tools for analyzing code structure and patterns"
    tools:
      - generate_ast
      - compare_code_similarity
      - compare_ast_similarity

  ddpm_code_tools:
    description: "Advanced code analysis tools using DDPM (Denoising Diffusion Probabilistic Models)"
    tools:
      - compare_codes_with_ddpm
      - code_fingerprint

  data_engineering:
    description: "All data engineering tools"
    tools:
      - generate_fake_data
      - generate_fake_data_ctgan
      - generate_fake_data_with_ddpm
      - generate_ast
      - compare_code_similarity
      - compare_ast_similarity
      - compare_codes_with_ddpm
      - code_fingerprint

# Tool metadata with additional information
tools:
  generate_fake_data:
    requires_llm_generation: false
    requires_file_path: true
    generates_file: true
    uses_ml_model: true
    description: "Generate synthetic data quickly from real data using WGAN (optimized for speed)"
    languages:
      - csv
      - json
      - parquet
      - r

  generate_fake_data_ctgan:
    requires_llm_generation: false
    requires_file_path: true
    generates_file: true
    uses_ml_model: true
    description: "Generate high-quality synthetic data from real data using CTGAN (Conditional Tabular GAN, optimized for tabular data quality)"
    languages:
      - csv
      - json
      - parquet
      - r

  generate_ast:
    requires_llm_generation: false
    requires_file_path: true
    languages:
      - python
      - r
    description: "Generate Abstract Syntax Tree from Python code"
    
  compare_code_similarity:
    requires_llm_generation: false
    requires_file_path: true
    uses_external_service: true
    external_service: "transformer"
    description: "Compare code similarity using CodeBERT embeddings"
    languages:
      - python
      - javascript
      - java
      - go
      - ruby
      - r

  compare_ast_similarity:
    requires_llm_generation: false
    requires_file_path: true
    uses_external_service: true
    external_service: "transformer"
    description: "Compare code similarity using AST-based CodeBERT embeddings"
    languages:
      - python
      - r
    uses_ast: true

  generate_fake_data_with_ddpm:
    requires_llm_generation: false
    requires_file_path: true
    generates_file: true
    uses_ml_model: true
    description: "Generate research-grade synthetic data using Gaussian Multinomial Diffusion (GMD/DDPM) from tabular-gmd library"
    languages:
      - csv
      - json
      - parquet
      - r
    uses_diffusion_model: true
    library: "tabular-gmd"

  compare_codes_with_ddpm:
    requires_llm_generation: false
    requires_file_path: true
    uses_external_service: true
    external_service: "tabular-gmd"
    description: "Compare two code files using DDPM-based embeddings from tabular-gmd service"
    languages:
      - python
      - r
    uses_diffusion_model: true
    metrics:
      - cosine
      - euclidean
      - wasserstein
      - mahalanobis
    default_metric: cosine
    
  code_fingerprint:
    requires_llm_generation: false
    requires_file_path: true
    uses_external_service: true
    external_service: "tabular-gmd"
    description: "Generate a unique fingerprint for code using DDPM embeddings from tabular-gmd service"
    languages:
      - python
      - r
    uses_diffusion_model: true
