#   timeout: 120
# 
# chat:
#   system_prompt: "You are a creative writing assistant. Help with storytelling, character development, and plot ideas."
#   max_context_length: 20
#   temperature: 0.9
#   stream: true

---

# Available Ollama models (examples):
# - llama2: General-purpose model
# - mistral: Fast and efficient model
# - codellama: Specialized for code
# - phi: Smaller, faster model
# - neural-chat: Conversational model
# - starling-lm: Instruction-following model
# 
# To pull a model: ollama pull <model-name>
# To list available models: use the 'models' command in the CLI
