# Example configuration for AI CLI
# This shows different configuration options you can use

# Example 1: Default local setup
ollama:
  url: "http://localhost:11434"
  model: "llama2"
  timeout: 120

chat:
  system_prompt: "You are a helpful AI assistant."
  max_context_length: 10
  temperature: 0.7
  stream: true

---

# Example 2: Remote Ollama server
# ollama:
#   url: "http://192.168.1.100:11434"  # Remote server IP
#   model: "mistral"
#   timeout: 180

---

# Example 3: Code-focused assistant
# ollama:
#   url: "http://localhost:11434"
#   model: "codellama"
#   timeout: 120
# 
# chat:
#   system_prompt: "You are an expert programming assistant. Provide clear, concise code examples and explanations."
#   max_context_length: 15
