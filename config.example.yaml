---

# Available Models:
#
# Ollama models (examples):
# - tinyllama: Lightweight model (~1GB, CPU-friendly) - Default in Docker setup
# - llama2: General-purpose model
# - llama3.1: Latest Llama version
# - mistral: Fast and efficient model
# - codellama: Specialized for code
# - phi: Smaller, faster model
# - neural-chat: Conversational model
# - starling-lm: Instruction-following model
#
# Ollama setup:
# - Docker Compose: docker compose exec ollama ollama pull <model-name>
# - Local installation: ollama pull <model-name>
# - CLI command: use 'switch' to select from available models
#
# Anthropic Claude models:
# - claude-sonnet-4-5-20250929: Latest Claude Sonnet 4.5 (most powerful)
# - claude-3-5-sonnet-20241022: Claude 3.5 Sonnet (October 2024)
# - claude-3-5-sonnet-20240620: Claude 3.5 Sonnet (June 2024)
# - claude-3-opus-20240229: Claude 3 Opus (most capable)
# - claude-3-sonnet-20240229: Claude 3 Sonnet (balanced)
# - claude-3-haiku-20240307: Claude 3 Haiku (fastest)
#
# Anthropic setup:
# - Add your API key to secrets.yml (see secrets.yaml.example)
# - Set provider: "anthropic" in this config file
# - CLI command: use 'switch' to select from available models
